services:
  app:
    container_name: app
    build: .
    # Dev: override the image's prod CMD with autoreload; the volume makes host
    # edits under gymhero/ hot-reload in the container.
    command: ["uvicorn", "gymhero.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./gymhero:/app/gymhero
    ports:
      - '8000:8000'
    depends_on:
      - db
    env_file:
      - .env.defaults
  db:
    container_name: db
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data
    env_file:
      - .env.defaults

volumes:
  db:
    driver: local

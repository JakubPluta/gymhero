[project]
name = "gymhero"
version = "0.1.0"
description = "Simple application to note down your workouts details"
authors = [{ name = "jp", email = "plutakuba@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "pydantic[email]>=2.10.0",
    "pwdlib[bcrypt]>=0.2.1",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "psycopg2-binary>=2.9.10",
    "testcontainers[postgres]>=4.8.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false
default-groups = "all"


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff]
target-version = "py313"
extend-exclude = ["tests", "migrations/*", "__init__.py"]
lint.ignore = ["E501"]

# FastAPI dependency-injection defaults (Depends/Query/Body) are the framework
# idiom, not the mutable-default anti-pattern B008 targets.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.codespell]
skip = "migrations/**/*,migrations,migrations/*.py"


[tool.coverage.run]
source = ["gymhero"]
branch = true
omit = [
    "gymhero/server.py",
    "gymhero/log.py",
    "gymhero/exceptions.py",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
packages = ["gymhero"]
ignore_missing_imports = true
warn_unused_ignores = true